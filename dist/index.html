<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
#bg{position:fixed;left:0;top:0;width:100%;height:100%;background:#0b0b10}
#glow{position:fixed;left:0;top:0;width:100%;height:100%;opacity:.55;background:radial-gradient(60vw 50vh at 72% 18%,var(--c1,#2b3a67),rgba(0,0,0,0) 70%)}
#top{position:fixed;top:4vh;left:4vw;right:4vw;display:flex;justify-content:space-between;font-size:2.2vw;opacity:.85}
#hero{position:fixed;left:4vw;top:20vh;width:60vw}
#hero h1{font-size:6.5vw;font-weight:700;letter-spacing:-.1vw}
#hero p{font-size:2.1vw;opacity:.7;margin-top:1.2vh}
#viewport{position:fixed;left:0;right:0;top:60vh;height:26vh;overflow:hidden}
#row{position:absolute;left:4vw;top:3vh;display:flex;white-space:nowrap;transition:transform .18s ease-out}
.tile{flex:0 0 auto;width:17vw;height:9.6vw;margin-right:2vw;border-radius:1.4vw;display:flex;align-items:center;justify-content:center;font-size:2.2vw;font-weight:600;text-align:center;padding:0 1vw}
.tile.f{outline:.35vw solid #fff;transform:scale(1.1)}
#hint{position:fixed;bottom:3vh;left:4vw;font-size:1.4vw;opacity:.5}
</style></head><body>
<div id="bg"></div><div id="glow"></div>
<div id="top"><span id="date"></span><span id="clock"></span></div>
<div id="hero"><h1 id="t">Home</h1><p id="s"></p></div>
<div id="viewport"><div id="row"></div></div>
<div id="hint"></div>
<script>
var APPS=[
 {n:"YouTube",id:"111299001912",url:"https://www.youtube.com/tv",c:["#ff0033","#2a0010"],s:"Opens YouTube"},
 {n:"Netflix",id:"3201907018807",url:"https://www.netflix.com/browse",c:["#e50914","#2a0004"],s:"Continue watching"},
 {n:"Prime Video",id:"3201910019365",url:"https://www.primevideo.com",c:["#00a8e1","#001a2a"],s:"Movies & series"},
 {n:"JioHotstar",id:"3201601007625",url:"https://www.hotstar.com",c:["#113ccf","#050a2a"],s:"Cricket, movies & shows"},
 {n:"Spotify",id:"3201606009684",url:"https://open.spotify.com",c:["#1db954","#04240f"],s:"Music"},
 {n:"SonyLIV",id:"",url:"https://www.sonyliv.com",c:["#333","#000"],s:"Live sports & shows"},
 {n:"ZEE5",id:"",url:"https://www.zee5.com",c:["#6c2bd9","#14062b"],s:"Shows & movies"}
];
var row=document.getElementById('row'),idx=0,tiles=[],hint=document.getElementById('hint'),glow=document.getElementById('glow').style;
hint.textContent='tizen:'+(typeof tizen!=='undefined'?'yes':'NO')+' | arrows to browse, OK to open';
APPS.forEach(function(a){var d=document.createElement('div');d.className='tile';d.textContent=a.n;
 d.style.background='linear-gradient(145deg,'+a.c[0]+','+a.c[1]+')';row.appendChild(d);tiles.push(d)});
function focus(i){var prev=idx;idx=Math.max(0,Math.min(APPS.length-1,i));
 tiles[prev].classList.remove('f');tiles[idx].classList.add('f');
 var a=APPS[idx];document.getElementById('t').textContent=a.n;document.getElementById('s').textContent=a.s||'';
 glow.setProperty('--c1',a.c[0]);
 var step=19*window.innerWidth/100;
 row.style.transform='translateX('+(-Math.max(0,idx-2)*step)+'px)'}
function web(a){if(a.url){hint.textContent='opening '+a.url;location.href=a.url}else{hint.textContent='No web fallback for '+a.n}}
function launch(){var a=APPS[idx];
 if(typeof tizen==='undefined'||!a.id){web(a);return}
 try{tizen.application.launch(a.id,function(){hint.textContent='launched '+a.n},function(e){hint.textContent='native failed ('+e.message+'), trying web';web(a)})}
 catch(e){hint.textContent='error: '+e.message;web(a)}}
document.addEventListener('keydown',function(e){var k=e.keyCode;
 if(k===39)focus(idx+1);else if(k===37)focus(idx-1);else if(k===13)launch()});
function tick(){var d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
 document.getElementById('date').textContent=d.toLocaleDateString([], {weekday:'long',day:'numeric',month:'long'})}
tick();setInterval(tick,20000);focus(0);
</script></body></html>
