<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=1920">
<title>Home</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
#bg{position:absolute;inset:-40px;background:radial-gradient(1200px 700px at 70% 20%,var(--c1,#2b3a67) 0,transparent 70%),radial-gradient(900px 600px at 10% 90%,var(--c2,#5a2a6b) 0,transparent 70%),#0b0b10;transition:background .6s;filter:blur(20px)}
#top{position:absolute;top:48px;left:80px;right:80px;display:flex;justify-content:space-between;font-size:30px;opacity:.85}
#hero{position:absolute;left:80px;top:230px;width:900px}
#hero h1{font-size:92px;font-weight:700;letter-spacing:-2px}
#hero p{font-size:30px;opacity:.7;margin-top:14px}
#row{position:absolute;left:0;right:0;top:650px;height:300px;display:flex;gap:36px;padding:40px 80px;overflow:hidden;white-space:nowrap}
.tile{flex:0 0 300px;height:170px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:600;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.45);transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s;position:relative}
.tile.f{transform:scale(1.18) translateY(-8px);box-shadow:0 30px 60px rgba(0,0,0,.65),0 0 0 4px rgba(255,255,255,.9);z-index:2}
#hint{position:absolute;bottom:40px;left:80px;font-size:22px;opacity:.45}
</style></head><body>
<div id="bg"></div>
<div id="top"><span id="date"></span><span id="clock"></span></div>
<div id="hero"><h1 id="t">Home</h1><p id="s"></p></div>
<div id="row"></div>
<div id="hint">Arrows to browse · OK to open</div>
<script>
var APPS=[
 {n:"YouTube",id:"111299001912",url:"https://www.youtube.com/tv",c:["#ff0033","#2a0010"],s:"Opens YouTube (ad-free via TizenTube)"},
 {n:"Netflix",id:"3201907018807",url:"https://www.netflix.com/browse",c:["#e50914","#2a0004"],s:"Continue watching"},
 {n:"Prime Video",id:"3201910019365",url:"https://www.primevideo.com",c:["#00a8e1","#001a2a"],s:"Movies & series"},
 {n:"JioHotstar",id:"3201601007625",url:"https://www.hotstar.com",c:["#113ccf","#050a2a"],s:"Cricket, movies & shows"},
 {n:"Spotify",id:"3201606009684",url:"https://open.spotify.com",c:["#1db954","#04240f"],s:"Music"},
 {n:"SonyLIV",id:"",url:"https://www.sonyliv.com",c:["#222","#000"],s:"Live sports & shows"},
 {n:"ZEE5",id:"",url:"https://www.zee5.com",c:["#6c2bd9","#14062b"],s:"Shows & movies"}
];
var row=document.getElementById('row'),idx=0,tiles=[];
var dbg=document.getElementById('hint');
dbg.textContent='tizen:'+(typeof tizen!=='undefined'?'yes':'NO')+' | arrows to browse, OK to open';
APPS.forEach(function(a){var d=document.createElement('div');d.className='tile';d.textContent=a.n;
 d.style.background='linear-gradient(145deg,'+a.c[0]+','+a.c[1]+')';row.appendChild(d);tiles.push(d)});
function focus(i){idx=Math.max(0,Math.min(APPS.length-1,i));
 tiles.forEach(function(t,k){t.classList.toggle('f',k===idx)});
 var a=APPS[idx];document.getElementById('t').textContent=a.n;document.getElementById('s').textContent=a.s||'';
 var bg=document.getElementById('bg').style;bg.setProperty('--c1',a.c[0]);bg.setProperty('--c2',a.c[1]);
 row.scrollLeft=Math.max(0,idx*336-600)}
function web(a){if(a.url){dbg.textContent='opening '+a.url;location.href=a.url}else{dbg.textContent='No web fallback for '+a.n}}
function launch(){var a=APPS[idx];
 if(typeof tizen==='undefined'||!a.id){web(a);return}
 try{tizen.application.launch(a.id,function(){dbg.textContent='launched '+a.n},function(e){dbg.textContent='native failed ('+e.message+'), trying web';web(a)})}
 catch(e){dbg.textContent='error: '+e.message;web(a)}}
document.addEventListener('keydown',function(e){var k=e.keyCode;
 if(k===39)focus(idx+1);else if(k===37)focus(idx-1);else if(k===13)launch()});
function tick(){var d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
 document.getElementById('date').textContent=d.toLocaleDateString([], {weekday:'long',day:'numeric',month:'long'})}
tick();setInterval(tick,20000);focus(0);
</script></body></html>
